    <style>
      .switch {
        position: relative;
        width: 60px;
        height: 34px;
        display: inline-block;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background-color: #ccc;
        border-radius: 17px;
        transition: 0.3s;
        cursor: pointer;
      }

      .slider::before {
        content: "";
        position: absolute;
        left: 4px;
        bottom: 4px;
        width: 26px;
        height: 26px;
        background-color: white;
        border-radius: 50%;
        transition: 0.3s;
      }

      .switch input:checked ~ .slider {
        background-color: blue;
      }
      .switch input:checked ~ .slider::before {
        transform: translateX(26px);
      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        background-color: darkslategrey;
        text-align: center;
        line-height: 1.6;
      }
      h1 {
        color: white;
      }

      .ruangan-keluarga {
        background-color: chocolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid #ccc;
      }
      .ruangan-item {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }
      .grup-lampu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      @media (min-width: 48em) {
        .ruangan-keluarga {
          flex-direction: row;
          justify-content: space-between;
          padding: 20px;
        }
      }
    </style>
